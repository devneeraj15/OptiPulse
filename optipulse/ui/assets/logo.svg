<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald-to-Cyan Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Violet-to-Indigo Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Metal Shield Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadow / Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect width="512" height="512" rx="110" fill="#090d16"/>
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Outer Orbit Tech Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-dasharray="8 6"/>
  
  <!-- Gauge Arc Segment -->
  <path d="M 110 320 A 175 175 0 1 1 402 320" fill="none" stroke="url(#borderGrad)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="480" stroke-dashoffset="60" filter="url(#pulseGlow)"/>

  <!-- Orbiting Satellite Nodes -->
  <circle cx="110" cy="320" r="5" fill="#38bdf8" filter="url(#pulseGlow)"/>
  <circle cx="402" cy="320" r="5" fill="#10b981" filter="url(#pulseGlow)"/>
  <circle cx="256" cy="81" r="6" fill="#a855f7" filter="url(#pulseGlow)"/>

  <!-- Center Hexagonal Silicon Core -->
  <polygon points="256,125 365,188 365,314 256,377 147,314 147,188" 
           fill="#0f172a" 
           stroke="url(#borderGrad)" 
           stroke-width="5" 
           stroke-linejoin="round"/>

  <!-- Inner Hex Silicon Layer -->
  <polygon points="256,145 348,198 348,304 256,357 164,304 164,198" 
           fill="#0b1120" 
           stroke="#334155" 
           stroke-width="2" 
           stroke-dasharray="6 4"
           stroke-linejoin="round"/>

  <!-- Circuit Trace Lines from Hex Core -->
  <line x1="256" y1="125" x2="256" y2="85" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="365" y1="188" x2="400" y2="168" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <line x1="365" y1="314" x2="400" y2="334" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="377" x2="256" y2="415" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
  <line x1="147" y1="314" x2="112" y2="334" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  <line x1="147" y1="188" x2="112" y2="168" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>

  <!-- High-Energy Heartbeat / Telemetry Pulse Waveform -->
  <path d="M 175 256 L 210 256 L 225 210 L 245 295 L 265 175 L 285 320 L 300 256 L 337 256" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Spark Core Beacon in Center -->
  <circle cx="265" cy="175" r="4.5" fill="#ffffff" filter="url(#pulseGlow)"/>
  <circle cx="285" cy="320" r="4.5" fill="#38bdf8" filter="url(#pulseGlow)"/>

  <!-- Bottom Speed Accent -->
  <path d="M 216 430 L 296 430" stroke="#10b981" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <circle cx="256" cy="430" r="2.5" fill="#34d399"/>
</svg>
